name: Flutter quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true
      - run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      # Analyzer errors fail the build. Existing warning-only cleanup is tracked
      # separately while the current workflow consolidation is in progress.
      - run: flutter analyze --no-fatal-warnings
      - run: flutter test
      - name: Verify generated Drift code
        run: dart run build_runner build
      - name: Fail on generated diff
        run: git diff --exit-code -- lib/data/local/app_database.g.dart
